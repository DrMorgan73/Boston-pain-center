<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Request — BPC Back Office</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="admin-top">
  <div class="mark">B</div>
  <div><small>Boston Pain Center</small><strong>Back Office</strong></div>
  <div class="spacer"></div>
  <a class="pub" href="/admin/">Requests</a>
  <a class="pub" href="/admin/media.html">Media</a>
  <a class="pub" href="/">View public site</a>
  <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
</header>

<main class="admin-wrap">
  <a class="back-link" href="/admin/">← All requests</a>
  <div class="notice err" id="loadError" hidden></div>

  <div id="content" hidden>
    <div class="sample-banner" id="sampleBanner" hidden>
      This is a <strong>sample request</strong> created for demonstration. It is not a real patient.
      <button class="btn btn-danger btn-sm" id="deleteSampleBtn" style="margin-left:12px">Delete sample</button>
    </div>

    <div class="detail-head">
      <h1 id="dName">—</h1>
      <span id="dPill"></span>
      <span class="ref" id="dRef"></span>
    </div>

    <div class="detail-grid">
      <div class="card">
        <dl class="kv">
          <dt>Received</dt><dd id="dCreated">—</dd>
          <dt>Type</dt><dd id="dType">—</dd>
          <dt>Service</dt><dd id="dService">—</dd>
          <dt>Email</dt><dd id="dEmail">—</dd>
          <dt>Phone</dt><dd id="dPhone">—</dd>
          <dt>Preferred date</dt><dd id="dDate">—</dd>
          <dt>Visit type</dt><dd id="dVisit">—</dd>
          <dt>Language</dt><dd id="dLang">—</dd>
        </dl>
        <div style="padding:0 20px 20px">
          <dt style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Reason for visit</dt>
          <div class="reason" id="dReason">—</div>
        </div>
      </div>

      <aside class="side">
        <div class="card">
          <h3>Status</h3>
          <select id="statusSel">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="scheduled">Scheduled</option>
            <option value="done">Done</option>
            <option value="archived">Archived</option>
          </select>
          <h3>Staff notes</h3>
          <ul class="notes" id="notesList"></ul>
          <textarea id="noteText" placeholder="Add a note — e.g. called patient, left voicemail…"></textarea>
          <button class="btn btn-primary" id="saveBtn" style="width:100%">Save changes</button>
          <div class="login-error" id="saveError" style="margin-top:12px" hidden></div>
        </div>
      </aside>
    </div>
  </div>
</main>

<script src="admin.js"></script>
<script>
(function () {
  var A = window.BPCAdmin;
  var id = new URLSearchParams(location.search).get('id');
  var errEl = document.getElementById('loadError');
  var saveErr = document.getElementById('saveError');
  var current = null;

  document.getElementById('logoutBtn').addEventListener('click', A.logout);

  if (!id) {
    errEl.textContent = 'Missing request id.';
    errEl.hidden = false;
    return;
  }

  function showError(msg) { errEl.textContent = msg; errEl.hidden = false; }

  A.api('/api/bpc-requests?id=' + encodeURIComponent(id))
    .then(function (data) {
      current = data.request;
      render();
      document.getElementById('content').hidden = false;
    })
    .catch(function (e) {
      if (e.message !== 'auth') showError(e.code === 'not_found' ? 'Request not found.' : 'Could not load this request.');
    });

  function render() {
    var r = current;
    document.getElementById('dName').textContent = r.name || '—';
    document.getElementById('dPill').innerHTML = A.pill(r.status, r.sample);
    document.getElementById('dRef').textContent = r.ref || '';
    document.getElementById('dCreated').textContent = A.fmtDate(r.createdAt);
    document.getElementById('dType').textContent = A.TYPE_LABELS[r.type] || r.type || '—';
    document.getElementById('dService').textContent = r.service || '—';
    document.getElementById('dEmail').textContent = r.email || '—';
    document.getElementById('dPhone').textContent = r.phone || '—';
    document.getElementById('dDate').textContent = r.preferredDate || '—';
    document.getElementById('dVisit').textContent = r.visitType || '—';
    document.getElementById('dLang').textContent = r.language === 'en' ? 'English' : 'Español';
    document.getElementById('dReason').textContent = r.reason || '—';
    document.getElementById('statusSel').value = r.status || 'new';
    document.getElementById('sampleBanner').hidden = !r.sample;

    var notes = r.notes || [];
    document.getElementById('notesList').innerHTML = notes.length
      ? notes.slice().reverse().map(function (n) {
          return '<li><div class="meta">' + A.esc(A.fmtDate(n.at)) + ' · ' + A.esc(n.by || 'staff') + '</div>' +
            A.esc(n.text) + '</li>';
        }).join('')
      : '<li style="border-color:var(--line)"><div class="meta">No notes yet</div></li>';
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = this;
    saveErr.hidden = true;
    btn.disabled = true;
    A.api('/api/bpc-requests', {
      method: 'PATCH',
      body: JSON.stringify({
        id: id,
        status: document.getElementById('statusSel').value,
        note: document.getElementById('noteText').value
      })
    }).then(function (data) {
      // refresh full record to show the new note
      return A.api('/api/bpc-requests?id=' + encodeURIComponent(id));
    }).then(function (data) {
      current = data.request;
      document.getElementById('noteText').value = '';
      render();
    }).catch(function (e) {
      if (e.message !== 'auth') {
        saveErr.textContent = 'Could not save. Please try again.';
        saveErr.hidden = false;
      }
    }).finally(function () { btn.disabled = false; });
  });

  document.getElementById('deleteSampleBtn').addEventListener('click', function () {
    if (!confirm('Delete this sample request?')) return;
    A.api('/api/bpc-requests?id=' + encodeURIComponent(id), { method: 'DELETE' })
      .then(function () { location.href = '/admin/'; })
      .catch(function (e) {
        if (e.message !== 'auth') showError('Could not delete the sample request.');
      });
  });
})();
</script>
</body>
</html>
